<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eldest Boy Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #008080;
    font-family: 'Trebuchet MS', 'Tahoma', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* === AIM WINDOW === */
  .aim-window {
    width: 520px;
    max-height: 90vh;
    background: #ece9d8;
    border: 2px solid #0054e3;
    border-radius: 8px 8px 0 0;
    box-shadow: 4px 4px 16px rgba(0,0,0,.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Title bar */
  .title-bar {
    background: linear-gradient(180deg, #0a246a 0%, #3a6ea5 6%, #4a86c8 50%, #3a6ea5 94%, #0a246a 100%);
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: default;
    user-select: none;
  }
  .title-bar img {
    width: 16px;
    height: 16px;
    image-rendering: pixelated;
  }
  .title-bar-text {
    color: white;
    font-size: 12px;
    font-weight: bold;
    flex: 1;
    text-shadow: 1px 1px 1px rgba(0,0,0,.4);
  }
  .title-buttons {
    display: flex;
    gap: 2px;
  }
  .title-btn {
    width: 21px;
    height: 21px;
    background: linear-gradient(180deg, #fff 0%, #e3dcd0 100%);
    border: 1px solid #0054e3;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
  }
  .title-btn:hover { background: linear-gradient(180deg, #fff 0%, #c8d8f0 100%); }
  .title-btn.close { color: #fff; background: linear-gradient(180deg, #e38264 0%, #c8503c 100%); }

  /* Menu bar */
  .menu-bar {
    background: #ece9d8;
    border-bottom: 1px solid #aca899;
    padding: 2px 4px;
    display: flex;
    gap: 2px;
    font-size: 11px;
  }
  .menu-item {
    padding: 2px 6px;
    cursor: pointer;
    border-radius: 2px;
  }
  .menu-item:hover { background: #316ac5; color: white; }

  /* Toolbar */
  .toolbar {
    background: linear-gradient(180deg, #ece9d8 0%, #d6d2c2 100%);
    border-bottom: 1px solid #aca899;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: #444;
  }
  .toolbar-sep {
    width: 1px;
    height: 18px;
    background: #aca899;
  }

  /* Buddy list sidebar + chat area */
  .main-area {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* Buddy list */
  .buddy-list {
    width: 140px;
    background: #fff;
    border-right: 1px solid #aca899;
    overflow-y: auto;
    font-size: 11px;
  }
  .buddy-header {
    background: linear-gradient(180deg, #e8e4d8 0%, #d6d2c2 100%);
    padding: 3px 6px;
    font-weight: bold;
    font-size: 10px;
    color: #333;
    border-bottom: 1px solid #aca899;
    user-select: none;
  }
  .buddy-header .triangle { font-size: 8px; margin-right: 4px; }
  .buddy {
    padding: 2px 6px 2px 18px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: default;
  }
  .buddy-icon {
    width: 12px;
    height: 12px;
    background: #ffd700;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .buddy-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
  }
  .online-count {
    padding: 4px 6px;
    font-size: 10px;
    color: #666;
    border-bottom: 1px solid #ddd;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  /* Messages */
  .messages {
    flex: 1;
    background: #fff;
    overflow-y: auto;
    padding: 6px;
    font-size: 12px;
    line-height: 1.4;
    border-bottom: 1px solid #aca899;
    min-height: 300px;
    max-height: 400px;
  }
  .msg { margin-bottom: 4px; word-wrap: break-word; }
  .msg .sn {
    font-weight: bold;
    cursor: default;
  }
  .msg .time {
    color: #999;
    font-size: 10px;
    margin-left: 4px;
  }
  .msg.system {
    color: #c00;
    font-style: italic;
    font-size: 11px;
    padding: 2px 0;
  }
  .msg.system .door-icon { margin-right: 4px; }

  /* Input area */
  .input-area {
    background: #ece9d8;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* Formatting toolbar */
  .format-bar {
    display: flex;
    gap: 2px;
    padding: 2px;
    font-size: 11px;
  }
  .fmt-btn {
    width: 22px;
    height: 20px;
    background: #fff;
    border: 1px solid #aca899;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    font-family: serif;
  }
  .fmt-btn:hover { background: #e0e0e0; }
  .fmt-btn.bold { font-weight: bold; }
  .fmt-btn.italic { font-style: italic; }
  .fmt-btn.underline { text-decoration: underline; }

  .input-row {
    display: flex;
    gap: 4px;
  }
  .msg-input {
    flex: 1;
    padding: 4px 6px;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    font-size: 12px;
    border: 2px inset #d4d0c8;
    resize: none;
    height: 50px;
    outline: none;
  }
  .msg-input:focus { border-color: #316ac5; }

  .send-btn {
    background: linear-gradient(180deg, #fff 0%, #e3dcd0 100%);
    border: 1px solid #aca899;
    border-radius: 3px;
    padding: 4px 16px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    align-self: flex-end;
    white-space: nowrap;
  }
  .send-btn:hover { background: linear-gradient(180deg, #fff 0%, #d0d8f0 100%); }
  .send-btn:active { background: #c8c4b8; }

  /* Warning bar */
  .warn-bar {
    background: #ffffcc;
    border-top: 1px solid #e0d88c;
    padding: 3px 8px;
    font-size: 9px;
    color: #666;
    text-align: center;
  }

  /* === SIGN IN SCREEN === */
  .sign-in-overlay {
    position: fixed;
    inset: 0;
    background: #008080;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .sign-in-box {
    width: 320px;
    background: #ece9d8;
    border: 2px solid #0054e3;
    border-radius: 8px 8px 0 0;
    box-shadow: 4px 4px 16px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .sign-in-title {
    background: linear-gradient(180deg, #0a246a 0%, #3a6ea5 6%, #4a86c8 50%, #3a6ea5 94%, #0a246a 100%);
    padding: 4px 8px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 1px 1px 1px rgba(0,0,0,.4);
  }
  .sign-in-body {
    padding: 24px 20px;
    text-align: center;
  }
  .aim-logo {
    font-family: 'VT323', monospace;
    font-size: 42px;
    color: #0054e3;
    margin-bottom: 4px;
    letter-spacing: -1px;
    line-height: 1;
  }
  .aim-subtitle {
    font-size: 10px;
    color: #666;
    margin-bottom: 20px;
  }
  .aim-running-man {
    font-size: 60px;
    margin-bottom: 12px;
    display: block;
    animation: runBounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes runBounce {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }
  .sign-in-body label {
    display: block;
    text-align: left;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #333;
  }
  .sign-in-body input[type="text"] {
    width: 100%;
    padding: 4px 6px;
    font-size: 13px;
    font-family: 'Trebuchet MS', Arial, sans-serif;
    border: 2px inset #d4d0c8;
    margin-bottom: 16px;
    outline: none;
  }
  .sign-in-body input[type="text"]:focus { border-color: #316ac5; }
  .sign-in-btn {
    background: linear-gradient(180deg, #fff 0%, #e3dcd0 100%);
    border: 1px solid #aca899;
    border-radius: 3px;
    padding: 6px 32px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .sign-in-btn:hover { background: linear-gradient(180deg, #fff 0%, #d0d8f0 100%); }
  .sign-in-version {
    margin-top: 16px;
    font-size: 9px;
    color: #999;
  }
  .back-link {
    display: inline-block;
    margin-top: 12px;
    font-size: 11px;
    color: #0054e3;
    text-decoration: underline;
    cursor: pointer;
  }

  /* Colors for screen names */
  .sn-color-0 { color: #c00; }
  .sn-color-1 { color: #00c; }
  .sn-color-2 { color: #080; }
  .sn-color-3 { color: #808; }
  .sn-color-4 { color: #c60; }
  .sn-color-5 { color: #088; }
  .sn-color-6 { color: #c0c; }
  .sn-color-7 { color: #00a; }

  /* Scrollbar styling */
  .messages::-webkit-scrollbar { width: 16px; }
  .messages::-webkit-scrollbar-track { background: #f0f0f0; border: 1px solid #ccc; }
  .messages::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #fff, #c8c4b8);
    border: 1px solid #aca899;
    border-radius: 0;
  }
  .buddy-list::-webkit-scrollbar { width: 14px; }
  .buddy-list::-webkit-scrollbar-track { background: #f0f0f0; }
  .buddy-list::-webkit-scrollbar-thumb { background: #c8c4b8; border: 1px solid #aca899; }

  /* Responsive */
  @media (max-width: 560px) {
    .aim-window { width: 100vw; max-height: 100vh; border-radius: 0; }
    .buddy-list { width: 100px; }
    .messages { min-height: 200px; }
  }
</style>
</head>
<body>

<!-- SIGN IN -->
<div class="sign-in-overlay" id="signIn">
  <div class="sign-in-box">
    <div class="sign-in-title">Sign On</div>
    <div class="sign-in-body">
      <span class="aim-running-man">🏃</span>
      <div class="aim-logo">Eldest Boy</div>
      <div class="aim-subtitle">Instant Messenger</div>
      <label for="screenNameInput">Screen Name</label>
      <input type="text" id="screenNameInput" maxlength="20" placeholder="Enter a screen name..." autofocus>
      <br>
      <button class="sign-in-btn" id="signInBtn">Sign On</button>
      <div class="sign-in-version">Version 6.66 &bull; &copy; Eldest Boy 2026</div>
      <a class="back-link" href="https://eldestboy.com">&larr; Back to site</a>
    </div>
  </div>
</div>

<!-- CHAT WINDOW -->
<div class="aim-window" id="chatWindow" style="display:none">
  <div class="title-bar">
    <div class="title-bar-text">Eldest Boy Chat - <span id="myNameTitle"></span></div>
    <div class="title-buttons">
      <div class="title-btn">_</div>
      <div class="title-btn">&#9633;</div>
      <div class="title-btn close" onclick="location.href='index.html'">&#10005;</div>
    </div>
  </div>
  <div class="menu-bar">
    <span class="menu-item">File</span>
    <span class="menu-item">Edit</span>
    <span class="menu-item">People</span>
    <span class="menu-item">Help</span>
  </div>
  <div class="toolbar">
    <span>🏃 Eldest Boy Chat Room</span>
    <div class="toolbar-sep"></div>
    <span id="onlineCountToolbar">0 online</span>
  </div>
  <div class="main-area">
    <div class="buddy-list">
      <div class="buddy-header"><span class="triangle">&#9660;</span> Online (<span id="onlineCount">0</span>)</div>
      <div id="buddyListInner"></div>
    </div>
    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <div class="format-bar">
          <div class="fmt-btn bold">B</div>
          <div class="fmt-btn italic">I</div>
          <div class="fmt-btn underline">U</div>
        </div>
        <div class="input-row">
          <textarea class="msg-input" id="msgInput" placeholder="Type a message..."></textarea>
          <button class="send-btn" id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>
  <div class="warn-bar">AIM is a registered trademark of AOL. This is a parody fan page for Eldest Boy.</div>
</div>

<!-- AIM Door sounds (base64 inline tiny beeps as fallback) -->
<script>
(function() {
  const SOUNDS = {
    doorOpen: null,
    doorClose: null,
    send: null,
    receive: null,
  };

  // Create tiny oscillator beeps as AIM-like sounds
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function beep(freq, duration, type = 'square') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
  }

  function playDoorOpen() {
    beep(800, 0.08);
    setTimeout(() => beep(1200, 0.08), 80);
    setTimeout(() => beep(1600, 0.12), 160);
  }
  function playDoorClose() {
    beep(1200, 0.08);
    setTimeout(() => beep(800, 0.08), 80);
    setTimeout(() => beep(400, 0.12), 160);
  }
  function playReceive() { beep(1000, 0.06); }
  function playSend() { beep(600, 0.04, 'sine'); }

  // --- State ---
  let ws = null;
  let myName = '';
  const snColors = {};
  let colorIdx = 0;

  function getSnColor(name) {
    if (!snColors[name]) { snColors[name] = colorIdx++ % 8; }
    return 'sn-color-' + snColors[name];
  }

  function formatTime(ts) {
    const d = new Date(ts);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function appendMessage(data) {
    const el = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg';

    if (data.type === 'system') {
      div.className = 'msg system';
      const isEnter = data.text.includes('entered');
      div.innerHTML = '<span class="door-icon">' + (isEnter ? '🚪' : '👋') + '</span>' + escapeHtml(data.text);
      if (isEnter) playDoorOpen();
      else playDoorClose();
    } else {
      const colorClass = getSnColor(data.screenName);
      const isMine = data.screenName === myName;
      div.innerHTML =
        '<span class="sn ' + colorClass + '">' + escapeHtml(data.screenName) + '</span>: ' +
        escapeHtml(data.text) +
        '<span class="time">' + formatTime(data.ts) + '</span>';
      if (isMine) playSend();
      else playReceive();
    }

    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
  }

  function updateBuddyList(users) {
    const inner = document.getElementById('buddyListInner');
    inner.innerHTML = '';
    users.forEach(name => {
      const div = document.createElement('div');
      div.className = 'buddy';
      const colorClass = getSnColor(name);
      div.innerHTML = '<div class="buddy-icon"></div><span class="buddy-name ' + colorClass + '">' + escapeHtml(name) + '</span>';
      inner.appendChild(div);
    });
    document.getElementById('onlineCount').textContent = users.length;
    document.getElementById('onlineCountToolbar').textContent = users.length + ' online';
  }

  let reconnectDelay = 1000;
  const MAX_RECONNECT = 10000;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = proto + '://' + location.host;
    console.log('WebSocket connecting to:', url);
    ws = new WebSocket(url);

    ws.onopen = () => {
      console.log('WebSocket connected');
      reconnectDelay = 1000;
      ws.send(JSON.stringify({ type: 'join', screenName: myName }));
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.type === 'history') {
        data.messages.forEach(m => appendMessage(m));
      } else if (data.type === 'online') {
        updateBuddyList(data.users);
      } else {
        appendMessage(data);
      }
    };

    ws.onerror = (e) => {
      console.error('WebSocket error:', e);
    };

    ws.onclose = (e) => {
      console.log('WebSocket closed, code:', e.code, 'reason:', e.reason);
      appendMessage({ type: 'system', text: 'Disconnected from server. Reconnecting...', ts: Date.now() });
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.5, MAX_RECONNECT);
    };
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'message', text }));
    input.value = '';
    input.focus();
  }

  function signIn() {
    const input = document.getElementById('screenNameInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    myName = name;
    document.getElementById('signIn').style.display = 'none';
    document.getElementById('chatWindow').style.display = 'flex';
    document.getElementById('myNameTitle').textContent = myName;
    document.getElementById('msgInput').focus();
    // Resume audio context (Chrome autoplay policy)
    if (audioCtx.state === 'suspended') audioCtx.resume();
    connect();
  }

  // Events
  document.getElementById('signInBtn').addEventListener('click', signIn);
  document.getElementById('screenNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') signIn();
  });
  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
})();
</script>
</body>
</html>
