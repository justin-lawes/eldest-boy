<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caterpillar Simulator — Eldest Boy Mode 8</title>
  <style>
    /* ========================================
       CATERPILLAR SIMULATOR — Mode 8
       All styles scoped to #mode-8-container
       ======================================== */
    #mode-8-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0; left: 0;
      background: #111;
      font-family: monospace;
    }
    #mode-8-container canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
      display: block;
    }
    #mode-8-container .touch-controls {
      display: none;
      gap: 8px;
      margin-top: 12px;
      user-select: none;
      -webkit-user-select: none;
    }
    #mode-8-container .touch-btn {
      width: 56px;
      height: 56px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 1.4rem;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #mode-8-container .touch-btn:active {
      background: rgba(255,255,255,0.3);
    }
    /* Show touch controls on touch devices */
    @media (hover: none) and (pointer: coarse) {
      #mode-8-container .touch-controls {
        display: flex !important;
      }
    }
  </style>
</head>
<body style="margin:0;background:#111;">
<div id="mode-8-container">
  <canvas id="caterpillar-canvas" width="800" height="340"></canvas>
  <div class="touch-controls">
    <div class="touch-btn" data-key="ArrowLeft">&larr;</div>
    <div class="touch-btn" data-key="ArrowDown">&darr;</div>
    <div class="touch-btn" data-key="ArrowRight">&rarr;</div>
    <div class="touch-btn" data-key="Space">POO</div>
    <div class="touch-btn" data-key="KeyC">C</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('caterpillar-canvas');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 340;

  // ---- BACKGROUND IMAGE ----
  const bgImg = new Image();
  bgImg.src = 'background.png';

  // ---- CATERPILLAR SPRITES ----
  const catSprites = [1,2,3,4].map(i => { const img = new Image(); img.src = `Position_${i}.png`; return img; });
  const CAT_SPRITE_W = 80, CAT_SPRITE_H = 50;
  const poopFallImg = new Image(); poopFallImg.src = 'Poop_Fall.png';
  const poopLandImg = new Image(); poopLandImg.src = 'Poop_Land.png';
  const POOP_W = 20, POOP_H = 20;

  // ---- CHRYSALIS SONG ----
  let chrysalisSong = null;
  let forestAmb = null, music1 = null, music2 = null;
  let music1FadingOut = false, music2Started = false, music1FadeTimer = 0;
  const MUSIC1_FADE_DUR = 2.0;

  function startAmbience() {
    if (forestAmb) return;
    forestAmb = new Audio('Caterpillar Sim_Forest Amb.mp3');
    forestAmb.loop = true; forestAmb.volume = 1;
    forestAmb.play().catch(()=>{});
    setTimeout(() => {
      if (!music1) {
        music1 = new Audio('Caterpillar Sim_Music_1.mp3');
        music1.loop = true; music1.volume = 1;
        music1.play().catch(()=>{});
      }
    }, 2000);
  }

  function stopAmbience() {
    if (forestAmb) { forestAmb.pause(); forestAmb.currentTime=0; forestAmb=null; }
    if (music1)    { music1.pause();    music1.currentTime=0;    music1=null; }
    if (music2)    { music2.pause();    music2.currentTime=0;    music2=null; }
    music1FadingOut=false; music2Started=false; music1FadeTimer=0;
  }

  function beginChrysalisFade(dt) {
    if (!music1FadingOut) { music1FadingOut=true; music1FadeTimer=0; }
    music1FadeTimer += dt;
    if (music1) {
      music1.volume = Math.max(0, 1 - music1FadeTimer / MUSIC1_FADE_DUR);
      if (music1.volume === 0) { music1.pause(); music1=null; }
    }
    if (!music2Started && music1FadeTimer >= MUSIC1_FADE_DUR / 2) {
      music2Started=true;
      music2 = new Audio('Caterpillar Sim_Music_2.mp3');
      music2.loop=false; music2.volume=1;
      music2.play().catch(()=>{});
      music2.addEventListener('ended', () => { state = 'WIN'; winFadeProgress = 0; });
    }
  }

  // ---- AUDIO ----
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // ---- SOUND EFFECTS ----
  function playTone(freq, type, duration, vol) {
    const ac = ensureAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.15;
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (duration || 0.2));
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + (duration || 0.2));
  }

  function playNoise(duration, vol) {
    const ac = ensureAudio();
    const bufferSize = ac.sampleRate * (duration || 0.05);
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buffer;
    const gain = ac.createGain();
    gain.gain.value = vol || 0.06;
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (duration || 0.05));
    src.connect(gain);
    gain.connect(ac.destination);
    src.start();
  }

  function soundMovement() { playNoise(0.03, 0.03); }

  function soundMunch() {
    const ac = ensureAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = 600;
    osc.frequency.exponentialRampToValueAtTime(200, ac.currentTime + 0.1);
    gain.gain.value = 0.15;
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.12);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 0.12);
  }

  function soundPoop() {
    playNoise(0.15, 0.12);
    playTone(120, 'sine', 0.15, 0.1);
  }
  function soundReady() { playTone(220, 'sine', 0.1, 0.15); setTimeout(()=>playTone(330, 'sine', 0.1, 0.12), 120); }

  function soundBirdWarning() {
    const ac = ensureAudio();
    [440, 550, 660].forEach((f, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.value = f;
      gain.gain.value = 0.08;
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.1 + 0.08);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(ac.currentTime + i * 0.1);
      osc.stop(ac.currentTime + i * 0.1 + 0.08);
    });
  }

  function soundBirdSquawk() {
    const ac = ensureAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 200;
    const lfo = ac.createOscillator();
    const lfoGain = ac.createGain();
    lfo.frequency.value = 20;
    lfoGain.gain.value = 50;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    lfo.start();
    gain.gain.value = 0.1;
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 0.3);
    lfo.stop(ac.currentTime + 0.3);
  }

  function soundDeath() {
    const ac = ensureAudio();
    const notes = [523, 494, 466, 440, 415, 392, 370, 349];
    notes.forEach((f, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.value = f;
      gain.gain.value = 0.1;
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.15 + 0.15);
      osc.connect(gain); gain.connect(ac.destination);
      osc.start(ac.currentTime + i * 0.15);
      osc.stop(ac.currentTime + i * 0.15 + 0.2);
    });
  }

  function soundNightDrone() {
    const ac = ensureAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.value = 80;
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(0.12, ac.currentTime + 2);
    gain.gain.linearRampToValueAtTime(0, ac.currentTime + 4);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 4);
  }

  // Chrysalis harp arpeggios
  let chrysalisNodes = [];
  function soundChrysalis() {
    const ac = ensureAudio();
    // C major arpeggio pattern ascending with octave repeats
    const notes = [261.6, 329.6, 392, 523.3, 659.3, 784, 1047, 784, 659.3, 523.3,
                   392, 329.6, 261.6, 329.6, 392, 523.3, 659.3, 784, 1047, 1319,
                   1047, 784, 659.3, 523.3, 392, 329.6, 261.6, 196, 261.6, 329.6,
                   392, 523.3, 659.3, 784, 1047, 784, 659.3, 523.3];
    const masterGain = ac.createGain();
    masterGain.gain.value = 0.08;
    masterGain.connect(ac.destination);
    chrysalisNodes.push(masterGain);

    notes.forEach((freq, i) => {
      // Play each note twice for echo effect
      [0, 0.15].forEach(delay => {
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const t = ac.currentTime + i * 0.5 + delay;
        g.gain.value = delay === 0 ? 0.12 : 0.05;
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        osc.connect(g); g.connect(masterGain);
        osc.start(t); osc.stop(t + 0.8);
        chrysalisNodes.push(osc);
      });
    });

    // Fade master out after 18 seconds
    masterGain.gain.setValueAtTime(0.08, ac.currentTime + 16);
    masterGain.gain.linearRampToValueAtTime(0, ac.currentTime + 20);
  }

  // ---- CONSTANTS ----
  const TRUNK_X=75, BRANCH_A_Y=240, BRANCH_B_Y=140;
  const BRANCH_A_START=80, BRANCH_A_END=560, BRANCH_B_START=80, BRANCH_B_END=700;
  const BRANCH_THICKNESS=28, TOTAL_TIME=55;
  const CAT_SPEED=38, CAT_STEP=10, CAT_FRAME_RATE=CAT_STEP/CAT_SPEED;
  const SEG_COUNT=5, SEG_SIZE=12, SEG_GAP=4;
  const LEAVES_A=[300], LEAVES_B=[400];
  const DIGEST_TIME=8, BIRD_PERCH_DUR=4;

  // ---- PRE-GENERATED BARK ----
  function genBarkPts(sx,ex){const pts=[];for(let x=sx+8;x<ex-8;x+=7)if(Math.random()<0.65)pts.push({x:x+Math.floor(Math.random()*5),dy:5+Math.floor(Math.random()*18)});return pts;}
  function genTrunkBarkPts(){const pts=[];for(let y=25;y<H-10;y+=9)for(let k=0;k<2;k++)pts.push({x:6+Math.floor(Math.random()*62),y:y+Math.floor(Math.random()*6)});return pts;}
  const barkA=genBarkPts(BRANCH_A_START,BRANCH_A_END);
  const barkB=genBarkPts(BRANCH_B_START,BRANCH_B_END);
  const barkTrunk=genTrunkBarkPts();

  // ---- STATE ----
  let state='TITLE', timer=0, poopCount=0;
  let catX=0, catFacing=-1, catOnUnderside=false, catPhase=1;
  let isMoving=false;
  let catSpriteFrame=0, catFrameTimer=CAT_FRAME_RATE;
  let leavesA=[], leavesB=[], leafParticles=[];
  let bird=null, birdCooldown=0, birdWarningShown=false, birdFirstOfPhase=true;
  let poops=[], climbProgress=0;
  let digestTimer=0, isDigesting=false;
  let poopMsg='', poopMsgTimer=0;
  let chrysalisProgress=0, chrysalisSwayAngle=0, chrysalisMotes=[];
  let winFadeProgress=0, chrysalisSoundPlayed=false;
  let gameOverTimer=0, deathFlash=0, deathSoundPlayed=false;
  const keys={};

  function triggerDeath(){if(state==='GAMEOVER')return;state='GAMEOVER';gameOverTimer=0;deathFlash=1;if(!deathSoundPlayed){deathSoundPlayed=true;soundDeath();}}
  function randomBirdCD(){
    if(birdFirstOfPhase){birdFirstOfPhase=false;return 2+Math.random()*2;}
    if(catPhase===1) return 3+Math.random()*2;
    if(catX<300) return 3+Math.random()*2;
    if(catX<500) return 2.5+Math.random()*1.5;
    return 2+Math.random()*1;
  }

  function resetGame(){
    state='PLAYING_PHASE1';timer=0;poopCount=0;
    catX=BRANCH_A_END-20;catFacing=-1;catOnUnderside=false;catPhase=1;
    isMoving=false;
    catSpriteFrame=0;catFrameTimer=CAT_FRAME_RATE;
    leavesA=LEAVES_A.map(x=>({x,eaten:false}));
    leavesB=LEAVES_B.map(x=>({x,eaten:false}));
    leafParticles=[];bird=null;birdFirstOfPhase=true;birdCooldown=randomBirdCD();birdWarningShown=false;
    poops=[];climbProgress=0;digestTimer=0;isDigesting=false;poopMsg='';poopMsgTimer=0;
    chrysalisProgress=0;chrysalisSwayAngle=0;
    chrysalisMotes=[];winFadeProgress=0;chrysalisSoundPlayed=false;
    gameOverTimer=0;deathFlash=0;deathSoundPlayed=false;
    if(chrysalisSong){chrysalisSong.pause();chrysalisSong=null;}
    music1FadingOut=false; music2Started=false; music1FadeTimer=0;
  }

  // ---- INPUT ----
  document.addEventListener('keydown',(e)=>{
    ensureAudio();keys[e.code]=true;
    if(e.code==='KeyR'&&state==='GAMEOVER'){stopAmbience();resetGame();startAmbience();}
    if(['Space','ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    if((e.code==='Space'||e.code==='Enter')&&state==='TITLE'){resetGame();startAmbience();keys['Space']=false;}
  });
  document.addEventListener('keyup',(e)=>{keys[e.code]=false;});
  document.querySelectorAll('#mode-8-container .touch-btn').forEach(btn=>{
    const kc=btn.dataset.key;
    btn.addEventListener('touchstart',(e)=>{e.preventDefault();ensureAudio();keys[kc]=true;if(kc==='Space'&&state==='TITLE')resetGame();});
    btn.addEventListener('touchend',(e)=>{e.preventDefault();keys[kc]=false;});
    btn.addEventListener('mousedown',()=>{ensureAudio();keys[kc]=true;if(kc==='Space'&&state==='TITLE')resetGame();});
    btn.addEventListener('mouseup',()=>{keys[kc]=false;});
  });

  // ---- DRAWING ----
  function drawTrunk(){
    ctx.fillStyle='#9C6B35';ctx.fillRect(0,20,5,H-20);
    ctx.fillStyle='#7B4A1A';ctx.fillRect(5,20,TRUNK_X-10,H-20);
    ctx.fillStyle='#5C3210';ctx.fillRect(TRUNK_X-5,20,5,H-20);
    ctx.fillStyle='#4A2810';barkTrunk.forEach(b=>ctx.fillRect(b.x,b.y,2,2));
  }
  function drawBranch(sx,ex,y,bark){
    const len=ex-sx;
    ctx.fillStyle='#9C6B35';ctx.fillRect(sx,y,len,5);
    ctx.fillStyle='#7B4A1A';ctx.fillRect(sx,y+5,len,17);
    ctx.fillStyle='#5C3210';ctx.fillRect(sx,y+22,len,6);
    ctx.fillStyle='#4A2810';bark.forEach(b=>ctx.fillRect(b.x,y+b.dy,2,2));
  }
  function drawLeaf(x,y){
    ctx.fillStyle='#388E3C';ctx.fillRect(x-1,y-20,2,8);
    ctx.fillStyle='#4CAF50';ctx.beginPath();ctx.ellipse(x,y-12,7,10,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#388E3C';ctx.fillRect(x-1,y-20,2,16);
    ctx.fillStyle='#66BB6A';ctx.fillRect(x+2,y-16,2,6);
  }
  function drawCaterpillar(x,y,facing,under){
    const img = catSprites[catSpriteFrame];
    if (!img.complete || !img.naturalWidth) return;
    const OFFSET=12;
    ctx.save();
    if(under){
      ctx.translate(x, y+BRANCH_THICKNESS-OFFSET);
      if(facing===1) ctx.scale(-1,1);
      ctx.scale(1,-1);
    } else {
      ctx.translate(x, y+OFFSET);
      if(facing===1) ctx.scale(-1,1);
    }
    ctx.drawImage(img, -CAT_SPRITE_W/2, -CAT_SPRITE_H, CAT_SPRITE_W, CAT_SPRITE_H);
    ctx.restore();
  }
  function drawBird(bx,by,bState,flipX){
    ctx.save();
    ctx.translate(bx,by);
    if(flipX) ctx.scale(-1,1);
    ctx.fillStyle='#D8D8D8';ctx.fillRect(-6,-3,12,8);
    ctx.fillStyle='#E8E8E8';ctx.fillRect(6,-5,6,6);
    ctx.fillStyle='#E8A030';ctx.fillRect(12,-3,4,2);
    ctx.fillStyle='#111';ctx.fillRect(9,-4,2,2);
    if(bState==='flying'){
      ctx.fillStyle='#888';
      ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-12,-10+Math.sin(timer*12)*4);ctx.lineTo(-2,-2);ctx.fill();
      ctx.beginPath();ctx.moveTo(4,0);ctx.lineTo(0,-10+Math.sin(timer*12+1)*4);ctx.lineTo(6,-2);ctx.fill();
    }else{
      ctx.fillStyle='#999';ctx.fillRect(-6,-2,4,6);ctx.fillRect(2,-2,4,6);
      ctx.fillStyle='#E8A030';ctx.fillRect(-2,5,1,4);ctx.fillRect(2,5,1,4);
    }
    ctx.restore();
  }
  function drawPoop(px,py,landed){
    ctx.fillStyle=landed?'#5A3010':'#6B4226';
    ctx.beginPath();ctx.arc(px,py,landed?6:4,0,Math.PI*2);ctx.fill();
    const img = landed ? poopLandImg : poopFallImg;
    if(img.complete&&img.naturalWidth>0){
      ctx.drawImage(img, px-POOP_W/2, py-POOP_H/2, POOP_W, POOP_H);
    }
  }
  function drawSparkle(px,py,age){const a=Math.max(0,1-age);ctx.fillStyle=`rgba(255,255,100,${a})`;const s=3+age*4;ctx.fillRect(px-1,py-s,2,s*2);ctx.fillRect(px-s,py-1,s*2,2);}

  const PX={
    '0':'11110,10010,10010,10010,11110','1':'01100,10100,00100,00100,11111','2':'11110,00010,11110,10000,11110',
    '3':'11110,00010,01110,00010,11110','4':'10010,10010,11110,00010,00010','5':'11110,10000,11110,00010,11110',
    '6':'11110,10000,11110,10010,11110','7':'11110,00010,00100,01000,01000','8':'11110,10010,11110,10010,11110',
    '9':'11110,10010,11110,00010,11110',
    'A':'01100,10010,11110,10010,10010','B':'11100,10010,11100,10010,11100','C':'01110,10000,10000,10000,01110',
    'D':'11100,10010,10010,10010,11100','E':'11110,10000,11100,10000,11110','F':'11110,10000,11100,10000,10000',
    'G':'01110,10000,10110,10010,01110','H':'10010,10010,11110,10010,10010','I':'11100,01000,01000,01000,11100',
    'J':'00010,00010,00010,10010,01100','K':'10010,10100,11000,10100,10010','L':'10000,10000,10000,10000,11110',
    'M':'10001,11011,10101,10001,10001','N':'10010,11010,10110,10010,10010','O':'01100,10010,10010,10010,01100',
    'P':'11100,10010,11100,10000,10000','R':'11100,10010,11100,10100,10010','S':'01110,10000,01100,00010,11100',
    'T':'11111,00100,00100,00100,00100','U':'10010,10010,10010,10010,01100','V':'10001,10001,10001,01010,00100',
    'W':'10001,10001,10101,11011,10001','X':'10010,10010,01100,10010,10010','Y':'10001,01010,00100,00100,00100',
    'Z':'11110,00010,00100,01000,11110','-':'00000,00000,11110,00000,00000',
    ':':'000,010,000,010,000','!':'010,010,010,000,010',' ':'0000,0000,0000,0000,0000',
    '[':'110,100,100,100,110',']':'011,001,001,001,011'
  };
  function pxTextWidth(text,sc){sc=sc||2;let w=0;for(let c=0;c<text.length;c++){const d=PX[text[c].toUpperCase()];w+=d?(d.split(',')[0].length+1)*sc:6*sc;}return w;}
  function drawPxText(text,x,y,sc,color){
    ctx.fillStyle=color||'#fff';sc=sc||2;let cx=x;
    for(let c=0;c<text.length;c++){const ch=text[c].toUpperCase(),d=PX[ch];if(!d){cx+=6*sc;continue;}
    const rows=d.split(',');for(let r=0;r<rows.length;r++)for(let col=0;col<rows[r].length;col++)if(rows[r][col]==='1')ctx.fillRect(cx+col*sc,y+r*sc,sc,sc);cx+=(rows[0].length+1)*sc;}
  }
  function drawPxTextCentered(text,cx,y,sc,color){drawPxText(text,cx-Math.floor(pxTextWidth(text,sc)/2),y,sc,color);}
  function drawHUD(){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,180,28);
    drawPxText('POOP:',10,8,2,'#fff');
    for(let i=0;i<2;i++){ctx.fillStyle=i<poopCount?'#6B4226':'#333';ctx.beginPath();ctx.arc(80+i*14,14,5,0,Math.PI*2);ctx.fill();}
    if(isDigesting){
      const prog=Math.min(digestTimer/DIGEST_TIME,1);
      ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.strokeRect(112,5,36,16);
      ctx.fillStyle='#5DBB47';ctx.fillRect(113,6,34*prog,14);
      ctx.fillStyle='#6B4226';ctx.beginPath();ctx.arc(156,13,4,0,Math.PI*2);ctx.fill();
    }
  }
  function spawnLeafParts(x,y){for(let i=0;i<6;i++)leafParticles.push({x,y,vx:(Math.random()-0.5)*60,vy:-Math.random()*40-20,life:0.5+Math.random()*0.3,age:0,color:Math.random()>0.5?'#4CAF50':'#66BB6A'});}
  function drawChrysalis(x,y,prog,sway){
    ctx.save();ctx.translate(x,y);ctx.rotate(sway);
    ctx.strokeStyle='#C8B060';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,12);ctx.stroke();
    if(prog<1){
      ctx.fillStyle=`rgba(80,160,60,${prog})`;ctx.beginPath();ctx.ellipse(0,20,6*prog,12*prog,0,0,Math.PI*2);ctx.fill();
      for(let a=0;a<prog*Math.PI*4;a+=0.4){const rx=Math.sin(a)*5*prog,ry=14+Math.cos(a)*10*prog;ctx.fillStyle=`rgba(200,180,80,${prog*0.5})`;ctx.fillRect(rx-1,ry,2,1);}
    }else{
      ctx.fillStyle='#4A8B5C';ctx.beginPath();ctx.ellipse(0,22,7,14,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#C8B060';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-3,12);ctx.lineTo(0,34);ctx.stroke();
      ctx.beginPath();ctx.moveTo(3,12);ctx.lineTo(0,34);ctx.stroke();
      ctx.fillStyle='#C8B060';ctx.fillRect(-1,16,2,2);ctx.fillRect(-1,22,2,2);ctx.fillRect(-1,28,2,2);
      ctx.fillStyle='rgba(120,200,130,0.4)';ctx.beginPath();ctx.ellipse(-2,20,3,8,0,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // ---- UPDATE ----
  let lastTime=0;
  function update(dt){
    if(state==='TITLE')return;
    if(state==='GAMEOVER'){gameOverTimer+=dt;deathFlash=Math.max(0,deathFlash-dt*3);return;}
    if(state==='WIN'){winFadeProgress+=dt/3;return;}
    if(state==='CHRYSALIS'){
      chrysalisProgress+=dt/4;if(chrysalisProgress>1)chrysalisProgress=1;
      chrysalisSwayAngle=Math.sin(timer*0.8)*0.035;
      if(Math.random()<dt*3)chrysalisMotes.push({x:Math.random()*W,y:H,vy:-10-Math.random()*15,life:3+Math.random()*3,age:0});
      chrysalisMotes.forEach(m=>{m.y+=m.vy*dt;m.age+=dt;});
      chrysalisMotes=chrysalisMotes.filter(m=>m.age<m.life);
      timer+=dt;
      beginChrysalisFade(dt);
      if(!chrysalisSoundPlayed){
        chrysalisSoundPlayed=true;
      }
      return;
    }
    timer+=dt;
    if(timer>=TOTAL_TIME){state='GAMEOVER';gameOverTimer=0;deathFlash=1;if(!deathSoundPlayed){deathSoundPlayed=true;soundNightDrone();soundDeath();}return;}

    isMoving=false;
    const bStart=catPhase===1?BRANCH_A_START:BRANCH_B_START,bEnd=catPhase===1?BRANCH_A_END:BRANCH_B_END;

    // ---- DIGESTION ----
    if(isDigesting){
      digestTimer+=dt;
      if(digestTimer>=DIGEST_TIME){
        isDigesting=false;digestTimer=0;
        if(poopCount<2){poopCount++;soundReady();}
      }
    }
    if(poopMsgTimer>0)poopMsgTimer=Math.max(0,poopMsgTimer-dt);

    if(state==='PLAYING_PHASE1'||state==='PLAYING_PHASE2'){
      const wantLeft=keys['ArrowLeft']&&!keys['ArrowRight'];
      const wantRight=keys['ArrowRight']&&!keys['ArrowLeft'];
      if(wantLeft) catFacing=-1;
      if(wantRight) catFacing=1;
      catOnUnderside=!!keys['ArrowDown'];
      // Cannot move while on underside
      if(!catOnUnderside&&(wantLeft||wantRight)){
        isMoving=true;
        catFrameTimer+=dt;
        if(catFrameTimer>=CAT_FRAME_RATE){
          catFrameTimer-=CAT_FRAME_RATE;
          catSpriteFrame=(catSpriteFrame+1)%4;
          soundMovement();
          if(wantLeft) catX-=CAT_STEP;
          if(wantRight) catX+=CAT_STEP;
          catX=Math.max(bStart+10,Math.min(bEnd-10,catX));
        }
      } else { isMoving=false; catSpriteFrame=0; catFrameTimer=CAT_FRAME_RATE; }
      // POOP — instant scare if bird is perched
      if(keys['Space']){
        keys['Space']=false;
        if(poopCount>0){
          poopCount--;
          const brY=catPhase===1?BRANCH_A_Y:BRANCH_B_Y;
          const py=catOnUnderside?brY+BRANCH_THICKNESS+SEG_SIZE+4:brY-SEG_SIZE-4;
          poops.push({x:catX,y:py,vy:200,sparkle:0,landed:false});soundPoop();
          if(bird&&bird.state==='perched'){bird.scared=true;bird.state='leaving';bird.timer=0;}
        } else {
          poopMsg=isDigesting?'STILL DIGESTING!':'NO POOP!';poopMsgTimer=2;
        }
      }
      // Chrysalis — only when no bird active on screen
      if(state==='PLAYING_PHASE2'&&catX>=BRANCH_B_END-10&&!bird&&keys['KeyC']){keys['KeyC']=false;state='CHRYSALIS';chrysalisProgress=0;return;}
      if(state==='PLAYING_PHASE1'&&catX<=BRANCH_A_START+15){state='CLIMBING';climbProgress=0;return;}
      // Leaf eating — only on top, triggers digestion
      const lvs=catPhase===1?leavesA:leavesB;
      if(!catOnUnderside)lvs.forEach(l=>{
        if(!l.eaten&&Math.abs(catX-l.x)<12){
          l.eaten=true;soundMunch();spawnLeafParts(l.x,catPhase===1?BRANCH_A_Y:BRANCH_B_Y);
          if(poopCount<2){isDigesting=true;digestTimer=0;}
        }
      });
    }
    if(state==='CLIMBING'){
      climbProgress+=dt/2;
      catFrameTimer+=dt;
      if(catFrameTimer>=CAT_FRAME_RATE){catFrameTimer-=CAT_FRAME_RATE;catSpriteFrame=(catSpriteFrame+1)%4;}
      if(climbProgress>=1){state='PLAYING_PHASE2';catPhase=2;catX=BRANCH_B_START+15;catFacing=1;catOnUnderside=false;birdFirstOfPhase=true;birdCooldown=randomBirdCD();}
    }

    // ---- BIRD ----
    if(state==='PLAYING_PHASE1'||state==='PLAYING_PHASE2'){
      birdCooldown-=dt;
      if(birdCooldown<=2&&birdCooldown>0&&!bird&&!birdWarningShown){birdWarningShown=true;soundBirdWarning();}
      if(birdCooldown<=0&&!bird){
        birdWarningShown=false;
        const targetBrY=catPhase===1?BRANCH_A_Y:BRANCH_B_Y;
        const bS=catPhase===1?BRANCH_A_START:BRANCH_B_START;
        const bE=catPhase===1?BRANCH_A_END:BRANCH_B_END;
        bird={x:W+20,y:30+Math.random()*30,state:'flying',timer:0,
          landX:0,targetY:targetBrY-10,scared:false};
      }
      if(bird){
        bird.timer+=dt;
        if(bird.state==='flying'){
          bird.x-=180*dt;
          if(bird.x<=catX+40){
            const bS2=catPhase===1?BRANCH_A_START:BRANCH_B_START;
            const bE2=catPhase===1?BRANCH_A_END:BRANCH_B_END;
            bird.landX=Math.max(bS2+60,Math.min(bE2-60,catX));
            bird.state='landing';bird.timer=0;soundBirdSquawk();
          }
          else if(bird.x<-30){bird=null;birdCooldown=randomBirdCD();}
        }else if(bird.state==='landing'){
          bird.x+=(bird.landX-bird.x)*dt*4;
          bird.y+=(bird.targetY-bird.y)*dt*4;
          if(Math.abs(bird.y-bird.targetY)<2&&Math.abs(bird.x-bird.landX)<2){bird.y=bird.targetY;bird.x=bird.landX;bird.state='perched';bird.timer=0;if(!catOnUnderside)triggerDeath();}
        }else if(bird.state==='perched'){
          if(!catOnUnderside)triggerDeath();
          if(bird.timer>=BIRD_PERCH_DUR){bird.state='leaving';bird.timer=0;}
        }else if(bird.state==='leaving'){
          bird.y-=70*dt;bird.x+=80*dt;
          if(bird.y<-40||bird.x>W+40){bird=null;birdCooldown=randomBirdCD();}
        }
      }
    }
    // Poop visuals (purely cosmetic — scare is instant on press)
    poops.forEach(p=>{
      if(!p.landed){
        p.vy+=400*dt;p.y+=p.vy*dt;
        if(p.y>H-10){p.landed=true;p.sparkle=0;}
      } else p.sparkle+=dt;
    });
    poops=poops.filter(p=>!p.landed||p.sparkle<2);
    leafParticles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=100*dt;p.age+=dt;});
    leafParticles=leafParticles.filter(p=>p.age<p.life);
  }

  // ---- RENDER ----
  function render(){
    if(bgImg.complete&&bgImg.naturalWidth>0){ctx.drawImage(bgImg,0,0,W,H);}
    else{ctx.fillStyle='#2A4A1A';ctx.fillRect(0,0,W,H);}

    const elapsed=timer;
    if(elapsed>=15&&state!=='CHRYSALIS'&&state!=='WIN'){
      let color;
      if(elapsed<35){
        const t=(elapsed-15)/20;
        color=`rgba(255,160,40,${t*0.22})`;
      }else if(elapsed<45){
        const t=(elapsed-35)/10;
        const r=Math.round(255-75*t),g=Math.round(160-100*t),b=Math.round(40+80*t);
        color=`rgba(${r},${g},${b},${0.22+t*0.23})`;
      }else{
        const t=Math.min((elapsed-45)/10,1);
        const r=Math.round(180-150*t),g=Math.round(60-50*t),b=Math.round(120-60*t);
        color=`rgba(${r},${g},${b},${0.45+t*0.30})`;
      }
      ctx.globalCompositeOperation='multiply';ctx.fillStyle=color;ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='source-over';
    }

    drawTrunk();
    drawBranch(BRANCH_A_START,BRANCH_A_END,BRANCH_A_Y,barkA);
    drawBranch(BRANCH_B_START,BRANCH_B_END,BRANCH_B_Y,barkB);
    leavesA.forEach(l=>{if(!l.eaten)drawLeaf(l.x,BRANCH_A_Y);});
    leavesB.forEach(l=>{if(!l.eaten)drawLeaf(l.x,BRANCH_B_Y);});
    leafParticles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=1-p.age/p.life;ctx.fillRect(p.x,p.y,3,3);});
    ctx.globalAlpha=1;

    if(state==='PLAYING_PHASE1'||state==='PLAYING_PHASE2'){
      drawCaterpillar(catX,catPhase===1?BRANCH_A_Y:BRANCH_B_Y,catFacing,catOnUnderside);
    }else if(state==='CLIMBING'){
      const cy=BRANCH_A_Y+(BRANCH_B_Y-BRANCH_A_Y)*climbProgress;
      drawCaterpillar(TRUNK_X, cy, -1, false);
    }
    if(state==='CHRYSALIS'||state==='WIN'){
      drawChrysalis(BRANCH_B_END-5,BRANCH_B_Y+BRANCH_THICKNESS,chrysalisProgress,chrysalisSwayAngle);
      chrysalisMotes.forEach(m=>{const a=Math.max(0,1-m.age/m.life)*0.4;ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fillRect(m.x,m.y,2,2);});
    }
    if(bird)drawBird(bird.x,bird.y,bird.state==='perched'?'perched':'flying',bird.state!=='leaving');
    poops.forEach(p=>{drawPoop(p.x,p.y,p.landed);if(p.landed&&p.sparkle<0.6)drawSparkle(p.x,p.y,p.sparkle/0.6);});
    if(state==='PLAYING_PHASE1'||state==='PLAYING_PHASE2'){
      drawHUD();
      if(birdCooldown<=2&&birdCooldown>0&&!bird)drawPxTextCentered('!',W-24,26,3,'#FF4444');
      if(state==='PLAYING_PHASE2'&&catX>=BRANCH_B_END-10&&!bird){
        ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(W/2-130,H-38,260,26);
        drawPxTextCentered('PRESS C TO MAKE CHRYSALIS',W/2,H-30,2,'#FFD700');
      }
      if(poopMsgTimer>0){
        const a=Math.min(poopMsgTimer,1);
        ctx.globalAlpha=a;
        const tw=pxTextWidth(poopMsg,2)+16;
        ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(W/2-tw/2,H/2-16,tw,24);
        drawPxTextCentered(poopMsg,W/2,H/2-10,2,'#FF6666');
        ctx.globalAlpha=1;
      }
    }

    if(state==='TITLE'){
      ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(120,30,560,280);
      ctx.strokeStyle='#5DBB47';ctx.lineWidth=2;ctx.strokeRect(120,30,560,280);
      drawPxTextCentered('CATERPILLAR',W/2,60,3,'#5DBB47');
      drawPxTextCentered('SIMULATOR',W/2,90,3,'#4CAF3A');
      ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(130,118,540,1);
      const lines=[['USE ARROW KEYS TO MOVE','#CCC'],['DOWN TO HIDE UNDER BRANCH','#FF9999'],['POOP AFTER BIRD LANDS TO SCARE IT','#CCC'],['EAT LEAVES - DIGEST FOR MORE POOP','#99FF99'],['REACH THE BRANCH TIP TO WIN','#CCC']];
      lines.forEach((l,i)=>drawPxTextCentered(l[0],W/2,132+i*24,2,l[1]));
      drawPxTextCentered('PRESS SPACE TO START',W/2,268,2,'#FFD700');
    }
    if(state==='GAMEOVER'){
      if(deathFlash>0){ctx.fillStyle=`rgba(255,0,0,${deathFlash*0.5})`;ctx.fillRect(0,0,W,H);}
      if(gameOverTimer>1){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);drawPxTextCentered('GAME OVER',W/2,H/2-20,3,'#FF4444');drawPxTextCentered('PRESS R TO RESTART',W/2,H/2+20,2,'#AAA');}
    }
    if(state==='WIN'){
      const fa=Math.min(winFadeProgress,1);ctx.fillStyle=`rgba(255,255,255,${fa})`;ctx.fillRect(0,0,W,H);
      if(winFadeProgress>0.5){const ta=Math.min((winFadeProgress-0.5)*2,1);ctx.globalAlpha=ta;ctx.fillStyle='#333';ctx.font='28px monospace';ctx.textAlign='center';ctx.fillText('You Win.',W/2,H/2-10);ctx.font='14px monospace';ctx.fillStyle='#888';ctx.fillText('Eldest Boy',W/2,H/2+20);ctx.globalAlpha=1;ctx.textAlign='left';}
    }
  }

  // ---- GAME LOOP ----
  function gameLoop(ts){const dt=Math.min((ts-lastTime)/1000,0.05);lastTime=ts;update(dt);render();requestAnimationFrame(gameLoop);}
  lastTime=performance.now();
  leavesA=LEAVES_A.map(x=>({x,eaten:false}));
  leavesB=LEAVES_B.map(x=>({x,eaten:false}));
  requestAnimationFrame(gameLoop);

  window.caterpillarGame={
    start:resetGame,
    stop:function(){state='TITLE';if(chrysalisSong){chrysalisSong.pause();chrysalisSong=null;}stopAmbience();}
  };

})();
</script>
